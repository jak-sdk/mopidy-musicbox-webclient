[tox]
envlist = py311, py312, py313, black, check-manifest, flake8, eslint, csslint, jstidy

[testenv]
sitepackages = true
extras = test
commands =
    python -m pytest \
        --basetemp={envtmpdir} \
        --cov=mopidy_musicbox_webclient --cov-report=term-missing \
        {posargs}

[testenv:black]
extras = lint
commands = python -m black --check .

[testenv:check-manifest]
extras = lint
commands = python -m check_manifest

[testenv:flake8]
extras = lint
commands = python -m flake8 --show-source --statistics --max-line-length 120

[testenv:jstest]
allowlist_externals =
    /bin/bash
extras = node
commands =
    - nodeenv --prebuilt {toxworkdir}/node_env
    bash -c '. {toxworkdir}/node_env/bin/activate; npm install; npm test'

[testenv:eslint]
allowlist_externals =
    /bin/bash
extras = node
commands =
    - nodeenv --prebuilt {toxworkdir}/node_env
    bash -c '. {toxworkdir}/node_env/bin/activate; npm install; npm run eslint'

[testenv:csslint]
allowlist_externals =
    /bin/bash
extras = node
skip_install = true
commands =
    - nodeenv --prebuilt {toxworkdir}/node_env
    bash -c '. {toxworkdir}/node_env/bin/activate; npm install; npm run csslint'

[testenv:jstidy]
allowlist_externals =
    /bin/bash
extras = node
commands =
    - nodeenv --prebuilt {toxworkdir}/node_env
    bash -c '. {toxworkdir}/node_env/bin/activate; npm install; npm run tidy'
